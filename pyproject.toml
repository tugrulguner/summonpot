[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "summonpot"
version = "0.6.0"
description = "A contract-first Python framework for turning typed endpoint declarations into executable APIs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tugrul Guner" }]
keywords = ["ai", "api", "agentic", "framework", "http", "llm", "openapi", "pydantic", "structured-output", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-ai-slim>=2.27.1,<3",
]

[project.optional-dependencies]
serve = ["fastapi>=0.100.0", "uvicorn>=0.52.3"]
cli = ["typer>=0.9.0"]
openai = [
    "pydantic-ai-slim[openai]>=2.30.0,<3",
]
all = [
    "summonpot[serve,cli,openai,anthropic,google,groq,mistral,openrouter,xai]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.3",
    "pyright>=1.1.390",
    "pre-commit>=4.6.2",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "summonpot[all]",
    "towncrier>=25.8.0",
]
anthropic = [
    "pydantic-ai-slim[anthropic]>=2.27.1,<3",
]
google = [
    "pydantic-ai-slim[google]>=2.27.1,<3",
]
groq = [
    "pydantic-ai-slim[groq]>=2.27.1,<3",
]
mistral = [
    "pydantic-ai-slim[mistral]>=2.27.1,<3",
]
openrouter = [
    "pydantic-ai-slim[openrouter]>=2.27.1,<3",
]
xai = [
    "pydantic-ai-slim[xai]>=2.27.1,<3",
]

[project.urls]
Homepage = "https://github.com/tugrulguner/summonpot"
Repository = "https://github.com/tugrulguner/summonpot"
Issues = "https://github.com/tugrulguner/summonpot/issues"
Changelog = "https://github.com/tugrulguner/summonpot/blob/main/CHANGELOG.md"

[project.scripts]
summonpot = "summonpot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/summonpot"]
# Contributor guidance, not runtime data: it must not ship to users.
exclude = ["**/AGENTS.md"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "[#{issue}](https://github.com/tugrulguner/summonpot/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportAttributeAccessIssue = false
reportAssignmentType = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["summonpot"]
