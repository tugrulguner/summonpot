name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "README.md"
      - "ROADMAP.md"
      - ".github/workflows/deploy-website.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --shm-size=1g
    environment:
      name: production
      url: https://summonpot.modepot.io
    defaults:
      run:
        working-directory: website
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOCS_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust checkout for container-owned Git
        working-directory: .
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Verify browser image and package version contract
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const p=JSON.parse(readFileSync('package-lock.json')); const version=p.packages['node_modules/playwright'].version; if(version!=='1.63.0') throw Error('Expected locked Playwright 1.63.0, got '+version);"
      - run: npm run check
      - run: npm run build
      - run: npx wrangler deploy
