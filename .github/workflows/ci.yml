name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --all-extras --locked
      - run: uv run pyright src/ tests/

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: >-
          uv run pytest tests/ -v
          --cov=src/summonpot
          --cov-report=term-missing
          --cov-fail-under=85

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Verify distribution artifacts
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              assert "summonpot/__init__.py" in names, names
              # PEP 561: the marker is what makes the "Typing :: Typed"
              # classifier true for an installed wheel.
              assert "summonpot/py.typed" in names, names
              # Contributor guidance must not reach users.
              assert not [n for n in names if n.endswith("AGENTS.md")], names

          with tarfile.open(sdists[0]) as archive:
              names = archive.getnames()
              assert any(name.endswith("/src/summonpot/__init__.py") for name in names), names
              assert any(name.endswith("/src/summonpot/py.typed") for name in names), names
              # The wheel exclusion does not reach the sdist: hatchling
              # configures the two targets separately.
              assert not [n for n in names if n.endswith("AGENTS.md")], names

          print(f"verified {wheels[0]} and {sdists[0]}")
          PY
      - name: Type-check a consumer against the installed wheel
        run: |
          set -euo pipefail
          python3 -m venv /tmp/consumer
          /tmp/consumer/bin/python -m pip install --quiet --upgrade pip
          /tmp/consumer/bin/python -m pip install --quiet dist/*.whl
          mkdir -p /tmp/consumer-src
          # useLibraryCodeForTypes=false is what makes this a real check: with
          # pyright's default of true it infers types from library source and
          # passes whether or not the marker shipped. Turned off, an installed
          # package without py.typed reports reportMissingTypeStubs.
          cat > /tmp/consumer-src/pyrightconfig.json <<'JSON'
          {
            "useLibraryCodeForTypes": false,
            "reportMissingTypeStubs": "error",
            "typeCheckingMode": "basic"
          }
          JSON
          cat > /tmp/consumer-src/consumer.py <<'PY'
          """A minimal consumer of the public API, type-checked against the wheel.

          Resolves summonpot from site-packages, not from this checkout, so it
          fails if the installed distribution carries no py.typed marker.
          """

          from summonpot import AtMost, CallBounds, Operation, Summon

          summon: Summon = Summon("consumer")
          bounds: CallBounds = AtMost(1)


          def _describe(op: Operation) -> str:
              return f"{op!r} under {bounds!r}"
          PY
          cd /tmp/consumer-src
          # Pinned to the exact version in uv.lock. Unpinned, the acceptance
          # result moves with whatever Pyright released that morning, and the
          # job resolves an unreviewed package on every run.
          uvx pyright@1.1.411 --pythonpath /tmp/consumer/bin/python consumer.py
