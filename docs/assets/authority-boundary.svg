<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">One Summonpot declaration combines deterministic work and agentic choice</title>
  <desc id="desc">A typed request enters one Summonpot endpoint declaration. Trusted request bindings and exact application operations form the deterministic side. Explicit AgentChoice arguments form the agentic side. Both produce one validated typed HTTP and OpenAPI response.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a13"/>
      <stop offset="1" stop-color="#11142b"/>
    </linearGradient>
    <linearGradient id="declaration" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1438" height="518" rx="24" fill="url(#background)" stroke="#29314d" stroke-width="2"/>
  <path d="M292 270 H342" fill="none" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow-cyan)"/>
  <path d="M1098 270 H1148" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow-green)"/>

  <text x="720" y="54" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700">One declaration. Deterministic work + agentic choice.</text>
  <text x="720" y="82" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">The public endpoint contract stays the same.</text>

  <g>
    <rect x="40" y="160" width="250" height="220" rx="16" fill="#0b1825" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="72" cy="195" r="7" fill="#22d3ee" filter="url(#glow)"/>
    <text x="92" y="202" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">TYPED REQUEST</text>
    <text x="72" y="252" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">validated input</text>
    <text x="72" y="288" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">business data</text>
    <text x="72" y="338" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">caller owns data</text>
  </g>

  <g>
    <rect x="350" y="105" width="740" height="330" rx="18" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
    <rect x="351" y="106" width="738" height="328" rx="17" fill="url(#declaration)"/>
    <text x="720" y="145" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">@summon("/research")</text>
    <text x="720" y="170" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">one endpoint declaration</text>

    <rect x="385" y="195" width="320" height="170" rx="13" fill="#092019" stroke="#34d399" stroke-width="2"/>
    <circle cx="414" cy="226" r="6" fill="#34d399" filter="url(#glow)"/>
    <text x="433" y="233" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">DETERMINISTIC</text>
    <text x="414" y="276" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">FromRequest("topic")</text>
    <text x="414" y="310" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">exact app operation</text>
    <text x="414" y="340" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">local validation</text>

    <rect x="735" y="195" width="320" height="170" rx="13" fill="#17112b" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="764" cy="226" r="6" fill="#a78bfa" filter="url(#glow)"/>
    <text x="783" y="233" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">AGENTIC</text>
    <text x="764" y="276" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">AgentChoice()</text>
    <text x="764" y="310" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">bounded model decision</text>
    <text x="764" y="340" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">declared authority only</text>

    <rect x="385" y="382" width="670" height="34" rx="10" fill="#211608" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="720" y="405" text-anchor="middle" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">Required(..., calls=Exactly(1))</text>
  </g>

  <g>
    <rect x="1150" y="160" width="250" height="220" rx="16" fill="#092019" stroke="#34d399" stroke-width="2"/>
    <circle cx="1182" cy="195" r="7" fill="#34d399" filter="url(#glow)"/>
    <text x="1202" y="202" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">TYPED RESPONSE</text>
    <text x="1182" y="252" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">validated output</text>
    <text x="1182" y="288" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">HTTP route</text>
    <text x="1182" y="322" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">OpenAPI</text>
    <text x="1182" y="358" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">one public contract</text>
  </g>
</svg>
