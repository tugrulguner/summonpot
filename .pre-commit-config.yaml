repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python]
        args: [src, tests, examples, scripts]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python]
        args: [src, tests, examples, scripts]
        pass_filenames: false
